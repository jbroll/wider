#!/bin/bash
# deploy.conf — mapper → https://apps.rkroll.com/mapper/
#
# Mounted under /mapper on the apps.rkroll.com vhost, whose own project is
# ~/src/rkroll.com/apps. Apache serves dist/index.html and proxies /mapper/ors
# to the home OpenRouteService. Token auth gates the whole mount; open it as
# https://apps.rkroll.com/mapper/?token=<32 hex>.
#
# APACHE_MOUNT_PATH and APACHE_PROXY_URLS come from deploy.sh's apache-mount-path
# branch, which is not merged yet. Deploy with that branch checked out.
#
# Consumed by the ../../deploy.sh tool. Run from THIS directory:
#   ../../deploy.sh/deploy.sh init .     # first deploy
#   ../../deploy.sh/deploy.sh update .   # subsequent: rebuild and resync

# No letsencrypt: the apps.rkroll.com host vhost owns the cert.
export DEPLOY_TYPES="apache"

export APP_NAME="mapper"
export DOMAIN_NAME="apps.rkroll.com"
export REMOTE_HOST="apps.rkroll.com"
export REMOTE_USER="john"

export APACHE_MODE="hybrid"
export APACHE_MOUNT_PATH="/mapper"
export APACHE_PROXY_URLS="/mapper/ors=https://symon.rkroll.com:8443/routing/ors"
export APACHE_TOKEN_AUTH="yes"

# Runs npm run build here; the configure stage then syncs only dist/.
export APACHE_BUILD_ENABLED="yes"
export APACHE_CONTENT_DIR="${PROJECT_DIR}"
export APACHE_WEB_ROOT="/var/www/mapper"
export APACHE_SPA_MODE="no"
